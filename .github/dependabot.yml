version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      # Expo SDK packages are tightly versioned — bundle into one PR to
      # avoid drift. Pin via `expo install --check` in CI; Dependabot
      # follows npm semver but Expo's installer reconciles versions.
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-navigation:
        patterns:
          - '@react-navigation/*'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
      # react-dom pins react to the exact same version, so they must move
      # together or `npm ci` fails.
      react:
        patterns:
          - 'react'
          - 'react-dom'
      # Everything else updates individually.
    ignore:
      # @react-native/eslint-config peers on eslint ^8 || ^9; a major bump
      # breaks `npm ci` until RN's config supports it.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
