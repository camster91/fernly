name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Same gates as CI. A release never ships code that fails them.
  quality:
    name: Typecheck · Lint · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run ci

  build:
    name: EAS Build + Submit
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check audio is not placeholder
        run: npx tsx scripts/check-audio.ts
      - name: Install EAS CLI
        run: npm install -g eas-cli@^25
      - name: Check eas.json is filled in
        run: |
          if grep -q 'REPLACE_WITH_' eas.json; then
            echo "::error::Set submit.production.ios.ascAppId in eas.json (see RELEASING.md)."
            exit 1
          fi
      # `eas build` waits for the build to finish. We submit by build ID, not
      # --latest, so an overlapping run can't make us submit someone else's build.
      - name: Build iOS
        id: ios
        run: |
          eas build --platform ios --profile production --non-interactive --json > ios-build.json
          echo "build_id=$(jq -r '.[0].id' ios-build.json)" >> "$GITHUB_OUTPUT"
      # Uses the App Store Connect API key stored on EAS via
      # `eas credentials --platform ios` (one-time setup, see RELEASING.md).
      - name: Submit iOS to TestFlight
        run: eas submit --platform ios --profile production --id "${{ steps.ios.outputs.build_id }}" --non-interactive
      - name: Build Android
        id: android
        run: |
          eas build --platform android --profile production --non-interactive --json > android-build.json
          echo "build_id=$(jq -r '.[0].id' android-build.json)" >> "$GITHUB_OUTPUT"
      - name: Write Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
      - name: Submit Android to Play Internal
        run: eas submit --platform android --profile production --id "${{ steps.android.outputs.build_id }}" --non-interactive
      - name: Remove Play service account key
        if: always()
        run: rm -f google-play-service-account.json
