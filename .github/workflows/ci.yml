name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Crisis detector tests
        run: npm test

      - name: Expo Doctor (best-effort)
        run: npx expo install --check || true
        continue-on-error: true

  # Web bundle gate: catches runtime-only errors that typecheck/lint/test
  # miss — e.g. react vs react-dom version mismatch (audit C4), missing
  # platform polyfills, broken Metro transforms. Cheap (no Lint/Test
  # re-run; shares the node_modules cache).
  web-bundle:
    name: Expo web export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the web bundle. Failing here means the web build is broken
      # even if typecheck/lint pass — the most common cause in this repo
      # has been react/react-dom version drift between dependabot bumps.
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      # Enforce a 2× ceiling over the 912 KiB baseline. This catches large
      # regressions while leaving room for expected product growth.
      - name: Enforce and report bundle size
        run: |
          SIZE=$(du -ck dist/_expo/static/js/web/*.js | tail -1 | cut -f1)
          BUDGET_KB=1824
          echo "Web bundle: ${SIZE} KiB (budget: ${BUDGET_KB} KiB)"
          echo "## Web bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "${SIZE} KiB / ${BUDGET_KB} KiB budget" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt "$BUDGET_KB" ]; then
            echo "Web bundle exceeds the ${BUDGET_KB} KiB budget"
            exit 1
          fi
